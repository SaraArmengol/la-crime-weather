# Central configuration. Change analysis scope here, not in code.

date_range:
  start: "2020-01-01"
  # Stop at 2023: on March 7, 2024 LAPD moved to a new records system (NIBRS), and this
  # dataset only contains incidents from the retiring system after that date, so 2024
  # counts are incomplete. The class version's "2024 drop in crime" was this artifact.
  end: "2023-12-31"

lapd:
  # LA Open Data (Socrata) dataset: "Crime Data from 2020 to Present"
  base_url: "https://data.lacity.org/resource/2nrs-mtv8.json"
  page_size: 50000
  # If you already have the CSV download, put it here and use `crime-weather extract --local-csv`
  local_csv: "data/raw/Crime_Data_from_2020_to_Present.csv"

weather:
  # Open-Meteo historical archive: free, no API key.
  # If your original project used a different API, swap the client in extract/weather.py.
  base_url: "https://archive-api.open-meteo.com/v1/archive"
  latitude: 34.0522      # Downtown Los Angeles
  longitude: -118.2437
  timezone: "America/Los_Angeles"
  hourly_variables:
    - temperature_2m
    - apparent_temperature
    - precipitation
    - rain
    - snowfall
    - cloud_cover
    - wind_speed_10m

scrape:
  # FBI UCR rates per 100,000 residents for large US cities (the data year is stated on the page)
  url: "https://en.wikipedia.org/wiki/List_of_United_States_cities_by_crime_rate"
  table_index: 0
  benchmark_state: "California"

features:
  temp_bins_f: [-100, 60, 70, 80, 90, 200]
  temp_labels: ["<60", "60-70", "70-80", "80-90", "90+"]
  weather_type:
    # Labels from the class version, converted from Celsius (28/15/11 C) to Fahrenheit.
    # Based on the daily MEAN temperature (day + night), so "Hot" days are rare in LA.
    rain_threshold_mm: 1.0     # class version used > 0 mm, which counted drizzle as a rainy day
    cloudy_threshold_pct: 70
    hot_min_f: 82.4
    warm_min_f: 59.0
    cool_min_f: 51.8

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  warehouse: "data/warehouse.duckdb"
  app_data: "app/data"
  figures: "reports/figures"
